context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-printf
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/lib/q/mod/kx
    - cp printf.q $PREFIX/lib/q/mod/kx/

about:
  homepage: https://github.com/KxSystems/printf
  repository: https://github.com/KxSystems/printf
  summary: Replicates a subset of the C99 printf standard to format strings.
  description: >-
    Replicates a subset of the C99 printf standard to format strings.
  license: Apache-2.0
  license_file: LICENSE

tests:
  - script:
    - test -f ${PREFIX}/lib/q/mod/kx/printf.q
